name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APP_MODE: local
      DATABASE_URL: postgresql://hardware:hardware@127.0.0.1:5432/hardware_test
      DATABASE_SSL: "false"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      LOCAL_OWNER_ID: 00000000-0000-4000-8000-000000000001
      LOCAL_OWNER_NAME: CI local owner
      POSTGRES_DB: hardware_test
      POSTGRES_USER: hardware
      POSTGRES_PASSWORD: hardware
      HEALTHCHECK_TOKEN: ci-healthcheck-token-at-least-thirty-two-characters
      YOUTUBE_API_KEY: ci-youtube-key-not-a-real-credential
      RELEASE_SHA: ${{ github.sha }}
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: hardware_test
          POSTGRES_USER: hardware
          POSTGRES_PASSWORD: hardware
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hardware -d hardware_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run desktop:check
      - run: npm test
      - run: npm run test:bdd
      - run: npm run db:check
      - run: npm run db:migrate
      - run: npm run db:smoke
      - run: npm run db:api-smoke
      - run: npm run db:mutation-smoke
      - run: npm run build
      - run: npm run desktop:compile
      - run: npm run desktop:runtime
      - run: npm run desktop:icons
      - run: npm run desktop:scan
      - run: npm run security:audit
      - run: shellcheck deploy/*.sh scripts/desktop/*.sh
      - run: docker compose --profile tools --env-file .env.example config --quiet
      - run: >-
          docker build
          --build-arg NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000
          --tag hardware:ci .

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_MODE: demo
      DEMO_USER_ROLE: admin
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  windows-launcher:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Parse local PowerShell launcher
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\hardware.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
