name: Desktop prerelease

on:
  push:
    tags:
      - v0.2.0-alpha.*
  workflow_dispatch:
    inputs:
      target:
        description: Desktop platform artifacts to build
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
          - all

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:check
      - name: Require the tag to match package.json
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node -e
          "const p=require('./package.json');
          if ('v'+p.version !== process.env.RELEASE_TAG)
          throw new Error('Tag '+process.env.RELEASE_TAG+' does not match package '+p.version)"

  windows:
    needs: validate
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.target != 'linux')
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run postgres:acquire:win
      - run: npm run desktop:package:win
      - run: npm run release:metadata -- --platform windows
      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hardware-desktop-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            release/desktop/*.exe
            release/desktop/*.zip
            release/desktop/*sbom.cdx.json
            release/desktop/SHA256SUMS-win-x64.txt
            release/desktop/THIRD_PARTY_NOTICES.md
            release/desktop/postgres-provenance.lock.json

  linux:
    needs: validate
    if: >-
      (github.event_name == 'push' && endsWith(github.ref_name, 'alpha.2')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target != 'windows')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install PostgreSQL build prerequisites
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          build-essential bzip2 ca-certificates curl patchelf zlib1g-dev
      - run: npm ci
      - run: npm run postgres:acquire:linux
      - run: npm run desktop:package:linux
      - run: npm run release:metadata -- --platform linux
      - name: Upload Ubuntu desktop artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hardware-desktop-linux
          if-no-files-found: error
          retention-days: 14
          path: |
            release/desktop/*.deb
            release/desktop/*.AppImage
            release/desktop/*sbom.cdx.json
            release/desktop/SHA256SUMS-linux-x64.txt
            release/desktop/THIRD_PARTY_NOTICES.md
            release/desktop/postgres-provenance.lock.json

  prerelease:
    needs:
      - windows
      - linux
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.windows.result == 'success' &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hardware-desktop-*
          path: artifacts
          merge-multiple: true
      - name: Create consolidated checksums
        working-directory: artifacts
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS-*' -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish unsigned personal alpha
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "${RELEASE_TAG}"
          artifacts/*
          --prerelease
          --verify-tag
          --title "Hardware ${RELEASE_TAG} (unsigned personal alpha)"
          --generate-notes
