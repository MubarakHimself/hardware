name: hardware

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  DATABASE_SSL: ${DATABASE_SSL:-false}
  DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env.production}
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set Clerk publishable key}
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
  CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:?Set webhook secret}
  ADMIN_CLERK_USER_IDS: ${ADMIN_CLERK_USER_IDS:?Set at least one admin Clerk user ID}
  HEALTHCHECK_TOKEN: ${HEALTHCHECK_TOKEN:?Set HEALTHCHECK_TOKEN}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:?Set YOUTUBE_API_KEY}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  RELEASE_SHA: ${RELEASE_SHA:-development}

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hardware}
      POSTGRES_USER: ${POSTGRES_USER:-hardware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 256mb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  migrate:
    image: hardware:${RELEASE_SHA:-development}
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set Clerk publishable key}
    environment:
      <<: *app-environment
      SERVICE_NAME: hardware-migrate
    command: ["node", "dist-db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  web:
    image: hardware:${RELEASE_SHA:-development}
    environment:
      <<: *app-environment
      SERVICE_NAME: hardware-web
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  worker:
    image: hardware:${RELEASE_SHA:-development}
    environment:
      <<: *app-environment
      SERVICE_NAME: hardware-worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    command: ["node", "dist-worker/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const{Client}=require('pg');const c=new Client({connectionString:process.env.DATABASE_URL});c.connect().then(()=>c.query(\"select 1 from worker_heartbeats where last_seen_at > now()-interval '45 seconds'\")).then(r=>{if(!r.rowCount)process.exitCode=1}).catch(()=>process.exitCode=1).finally(()=>c.end())",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - backend

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
